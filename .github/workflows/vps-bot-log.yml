name: VPS estado do regime-rider
# Le o estado das TRES instancias do Regime Rider na VPS (long / short / both)
# e escreve-o em regime-rider/status.md no proprio repo. Existe para resolver
# a limitacao estrutural registada no ops log: as sessoes/checks na cloud nao
# alcancam o PC do utilizador, nem conseguem ler os logs do Actions de forma
# fiavel. Um ficheiro no repo e legivel por qualquer sessao, para sempre.
#
# NAO altera nada na VPS — so le. Seguro de disparar a qualquer momento.
#
# PRIVACIDADE: o repo e PUBLICO. O status.md publica apenas campos
# operacionais. NAO publica equity, quantidade, preco de entrada nem stop —
# esses ficam so na VPS, visiveis no output do job.
on:
  workflow_dispatch:
  schedule:
    - cron: "25 0 * * *"   # 00:25 UTC — 18 min depois da corrida diaria

permissions:
  contents: write

concurrency:
  group: regime-rider-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: [self-hosted, vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (sha fixo)

      - name: Output completo para quem estiver a ver o job
        run: |
          echo "==== AGORA (UTC) ===="; date -u
          echo; echo "==== TIMER ===="
          systemctl list-timers regime-rider.timer --all --no-pager || true
          echo; echo "==== ULTIMA CORRIDA DO SERVICO ===="
          systemctl status regime-rider.service --no-pager | head -16 || true
          for v in long short both; do
            echo; echo "######## $v ########"
            echo "-- state.json (completo, so aqui) --"
            cat /opt/regime-rider/$v/state.json || true
            echo "-- bot.log (40) --"
            tail -n 40 /opt/regime-rider/$v/bot.log || true
          done
          echo; echo "==== journalctl ===="
          sudo journalctl -u regime-rider.service -n 80 --no-pager || true

      - name: Construir regime-rider/status.md (sem dados financeiros)
        run: |
          set -eu
          command -v jq >/dev/null || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y jq
          NEXT=$(systemctl list-timers regime-rider.timer --all --no-pager 2>/dev/null | sed -n '2p' | cut -c1-40 || echo "?")
          SVC=$(systemctl is-active regime-rider.timer 2>/dev/null || echo inactive)
          LASTRUN=$(systemctl show regime-rider.service -p ExecMainExitTimestamp --value 2>/dev/null || echo "?")

          mkdir -p regime-rider
          {
            echo "# Regime Rider — estado das 3 instancias na VPS"
            echo
            echo "_Gerado por \`vps-bot-log.yml\`. Nao editar a mao._"
            echo
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| Snapshot (UTC) | $(date -u '+%Y-%m-%d %H:%M:%S') |"
            echo "| Timer | $SVC |"
            echo "| Proxima corrida | $NEXT |"
            echo "| Ultima corrida terminou | $LASTRUN |"
            echo
            echo "## Resumo"
            echo
            echo "| instancia | longs | shorts | corridas | em posicao | lado | kill switch | dry_run | chaves |"
            echo "|---|---|---|---|---|---|---|---|---|"
            for v in long short both; do
              C=/opt/regime-rider/$v/config.json
              S=/opt/regime-rider/$v/state.json
              L=/opt/regime-rider/$v/bot.log
              printf "| **%s** | %s | %s | %s | %s | %s | %s | %s | %s |\n" "$v" \
                "$(jq -r '.enable_longs' $C 2>/dev/null || echo '?')" \
                "$(jq -r '.enable_shorts' $C 2>/dev/null || echo '?')" \
                "$(grep -c 'Close=' $L 2>/dev/null || echo 0)" \
                "$(jq -r '.in_position // false' $S 2>/dev/null || echo '?')" \
                "$(jq -r 'if (.side // "")=="" then "-" else .side end' $S 2>/dev/null || echo '?')" \
                "$(jq -r '.halted // false' $S 2>/dev/null || echo '?')" \
                "$(jq -r '.dry_run' $C 2>/dev/null || echo '?')" \
                "$(jq -r 'if (.api_key|length)>0 then "SIM" else "nao" end' $C 2>/dev/null || echo '?')"
            done
            echo
            for v in long short both; do
              L=/opt/regime-rider/$v/bot.log
              echo "## $v"
              echo
              echo "**Ultima linha de decisao**"
              echo
              echo '```'
              grep -E "Close=" "$L" 2>/dev/null | tail -1 || echo "(sem decisao registada)"
              echo '```'
              echo
              echo "**Ultima accao**"
              echo
              echo '```'
              grep -E "Flat, no signal|ENTRY signal|opened|Moving stop|Stop unchanged|regime_flip|KILL SWITCH|Refusing to act|Simulated stop hit" "$L" 2>/dev/null | tail -1 || echo "(sem accao registada)"
              echo '```'
              echo
              echo "**Ultimas 10 decisoes**"
              echo
              echo '```'
              grep -E "Close=" "$L" 2>/dev/null | tail -10 || true
              echo '```'
              echo
            done
            echo "> Equity, quantidade, preco de entrada e stop NAO sao publicados"
            echo "> aqui (o repo e publico). Estao no output do job deste workflow."
            echo ">"
            echo "> \`HH20\`/\`LL20\` sao extremos de FECHOS diarios, nao de maximos"
            echo "> e minimos intraday. Comparar com wicks de um grafico da uma"
            echo "> fasquia diferente da que o bot usa."
          } > regime-rider/status.md
          echo "---- status.md ----"
          cat regime-rider/status.md

      - name: Commit do status (so se mudou)
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regime-rider/status.md
          if git diff --cached --quiet; then
            echo "Sem alteracoes no status — nada a commitar."
            exit 0
          fi
          git commit -m "regime-rider: status da VPS [skip ci]"
          for i in 1 2 3; do
            if git push; then echo "push ok"; exit 0; fi
            echo "push falhou (tentativa $i) — rebase e tentar de novo"
            git pull --rebase --autostash || true
            sleep 3
          done
          echo "push falhou 3x"; exit 1
