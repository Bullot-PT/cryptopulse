name: Lighter book scanner
on:
  schedule:
    # Same story as the OI collector: GitHub drops most scheduled fires on the free queue, so instead of
    # relying on six fires an hour, one delivered fire stays alive and scans on its own 5-minute timer.
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  # 'actions: write' é o que permite ao passo "Queue the next run" despachar a run seguinte.
  # workflow_dispatch é uma das duas excepções à regra do GitHub de que eventos criados com o
  # GITHUB_TOKEN não arrancam workflows — por isso a corrente funciona sem nenhum PAT pessoal.
  actions: write
concurrency:
  group: lighter-collect
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # ---- corrente de arranque ----------------------------------------------------------------
      # O cron lá em cima é só um pedido, e o GitHub deita fora quase todos (medido a 25-jul-2026:
      # mediana de 51 min entre fires entregues, pior caso 3h23m). Por isso esta run despacha já a
      # sua sucessora: o grupo de concorrência segura-a em fila enquanto esta corre e ela arranca no
      # instante em que esta acabar — quer acabe normalmente, por timeout, por crash ou cancelada.
      # É isto que transforma o coletor de "esperar que o cron caia" numa corrente contínua.
      - name: Queue the next run (chain)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          WF=lighter-collector.yml
          # Disjuntor: se já arrancaram 4 ou mais runs deste workflow nos últimos 15 minutos, alguma
          # coisa está a rebentar logo no arranque e a corrente virou um loop apertado. Nesse caso não
          # despacha nada e deixa o cron voltar a pegar nisto — antes um buraco do que centenas de runs.
          SINCE=$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.run_started_at > \"${SINCE}\")] | length" 2>/dev/null || echo 0)
          echo "runs deste workflow desde ${SINCE}: ${RECENT}"
          if [ "${RECENT:-0}" -ge 4 ]; then
            echo "disjuntor disparado — não despacho sucessora"
            exit 0
          fi
          if gh workflow run "$WF" --ref main; then
            echo "sucessora em fila — arranca no instante em que esta run terminar"
          else
            echo "não consegui despachar a sucessora — o cron fica como rede"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (sha fixo — a tag pode ser reescrita, o sha não)
      - name: Scan Lighter every 5 minutes for one hour
        run: |
          set -u
          git config user.name "oi-collector-bot"
          git config user.email "actions@users.noreply.github.com"

          END=$(( $(date +%s) + 3300 ))
          while : ; do
            echo "--- lighter pass at $(date -u +%H:%M:%SZ) ---"
            node lighter-collector.mjs || echo "scan exited non-zero — continuing"
            git add data/liq-book-lighter.json
            if ! git diff --cached --quiet; then
              git commit -m "Lighter book [skip ci]" >/dev/null || true
              # Same reason as in oi-collector.yml: never "git pull --rebase" in here. A rebase that
              # stops on a conflict leaves .git/rebase-merge on the runner and every later pass of this
              # run dies on it. Rebuilding the commit on top of the newest main cannot conflict.
              for i in 1 2 3 4 5; do
                if git push origin HEAD:main; then break; fi
                echo "push refused — rebuilding on top of origin/main (attempt $i)"
                cp -a data/liq-book-lighter.json /tmp/liq-book-lighter.json
                git rebase --abort 2>/dev/null || true
                git merge --abort 2>/dev/null || true
                if ! git fetch origin main; then sleep $((i * 5)); continue; fi
                git reset --hard FETCH_HEAD
                cp -a /tmp/liq-book-lighter.json data/liq-book-lighter.json
                git add data/liq-book-lighter.json
                if git diff --cached --quiet; then break; fi
                git commit -m "Lighter book [skip ci]" >/dev/null || true
                sleep $((i * 3))
              done
            fi
            NOW=$(date +%s)
            if [ "$NOW" -ge "$END" ]; then break; fi
            # grid + 150s: deliberately half-way between the OI collector's passes, so the two jobs are
            # not pushing to main at the same instant every five minutes
            sleep $(( 300 - (NOW % 300) + 150 ))
          done
