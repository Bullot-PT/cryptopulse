name: Lighter book scanner
on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *' # offset from the main collector so both pipelines run in parallel
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lighter-collect
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Lighter book
        run: node lighter-collector.mjs
      - name: Commit
        run: |
          git config user.name "oi-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/liq-book-lighter.json
          git commit -m "Lighter book [skip ci]" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 8; done
