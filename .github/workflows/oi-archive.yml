name: OI archive (KV -> git, hourly)
# Com o coletor OI na VPS (migração 2), o KV é quem serve o site em tempo real; este workflow
# guarda no git, de hora a hora, uma cópia dos ficheiros que o collect.mjs escreve — arquivo e
# fallback do raw. NÃO toca em liq-book-lighter.json (é do coletor Lighter, que continua a
# fazer push próprio). Valida o JSON antes de commitar — nunca se arquiva uma página de erro.
on:
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oi-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (sha fixo)
      - name: Descarregar do KV e commitar se mudou
        run: |
          set -u
          FILES="oi-history.json hl-pos.json hl-ls.json hl-wallets.json hl-seen.json alert-log.json alert-state.json radar-history.json liq-book.json liq-totals.json upbit.json kalshi.json cg-mirror.json oi-signals.json market-ls.json collector-health.json oi-signal-log.json"
          mkdir -p /tmp/kv
          GOT=""
          for f in $FILES; do
            if curl -s --max-time 30 "https://cryptomacho.io/data/${f}?b=$(date +%s)" -o "/tmp/kv/$f" \
               && [ -s "/tmp/kv/$f" ] \
               && python3 -c "import json,sys;json.load(open('/tmp/kv/$f'))" 2>/dev/null; then
              GOT="$GOT $f"
            else
              echo "salto ${f} — download falhou ou não é JSON válido"
            fi
          done
          [ -n "$GOT" ] || { echo "nada descarregado — termino sem mexer"; exit 0; }
          git config user.name "oi-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          apply() { for f in $GOT; do cp "/tmp/kv/$f" "data/$f"; done; }
          apply
          git add data/
          git diff --cached --quiet && { echo "sem mudanças — arquivo já em dia"; exit 0; }
          git commit -m "OI archive [skip ci]" >/dev/null
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push recusado — reconstruo em cima de origin/main (tentativa $i)"
            git fetch origin main && git reset --hard FETCH_HEAD
            apply
            git add data/
            git diff --cached --quiet && { echo "alguém já arquivou o mesmo — nada a fazer"; exit 0; }
            git commit -m "OI archive [skip ci]" >/dev/null
            sleep $((i * 3))
          done
          echo "push falhou após tentativas — a próxima hora arquiva"
          exit 0
      # v135 (18-ago-2026): ninguém vigiava os vigias. Entre 27-jul e 18-ago quatro ficheiros ficaram
      # congelados e este workflow limitou-se a dizer "salto X" numa linha de log que ninguém lê, hora
      # após hora. Agora um ficheiro quente parado faz o JOB FALHAR — e um workflow agendado que falha
      # manda email. É o alarme que faltava.
      - name: Vigia de frescura (falha se um ficheiro quente estiver parado)
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, time, sys
          LIM = {"oi-history.json":3, "hl-pos.json":3, "alert-log.json":3, "liq-book.json":3,
                 "cg-mirror.json":3, "oi-signals.json":1, "market-ls.json":3, "collector-health.json":1,
                 "radar-history.json":3, "liq-totals.json":3, "upbit.json":6, "kalshi.json":6,
                 "hl-ls.json":6, "hl-wallets.json":12, "hl-seen.json":6}
          now, bad, ok = time.time(), [], []
          for f, h in sorted(LIM.items()):
              p = "data/" + f
              if not os.path.exists(p):
                  bad.append(f + ": nao existe"); continue
              try:
                  t = json.load(open(p)).get("t")
              except Exception as e:
                  bad.append(f + ": json ilegivel (" + str(e) + ")"); continue
              if not isinstance(t, (int, float)):
                  ok.append(f + ": sem campo t (nao verificavel)"); continue
              age = (now - t / 1000) / 3600
              (ok if age <= h else bad).append("%s: %.1fh (limite %dh)" % (f, age, h))
          print("\n".join(ok))
          if bad:
              print("\n*** PARADOS ***"); print("\n".join(bad))
              sys.exit(1)
          print("todos frescos")
          EOF
