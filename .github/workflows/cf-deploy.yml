name: cf-deploy
on:
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: cf-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      CF_ZONE_ID: 58e910c80e16e6947f4a4fbd16f3698c
      SCRIPT_NAME: cryptomacho-data
      ROUTE_PATTERN: cryptomacho.io/data/*
      ROUTE_PATTERN2: cryptomacho.io/px/*
    steps:
      - name: Write worker module
        run: |
          cat > worker.js <<'WEOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              /* /px/bnf/<SYMBOL> — ponte para o depth dos FUTUROS da Binance. A fapi não tem
                 CORS, portanto o browser não lhe chega directamente; o Worker vai lá por ele e
                 serve do nosso próprio domínio. cacheTtl 2 s no edge: mil separadores abertos
                 continuam a ser ~1 pedido/2 s à Binance. Se a Binance geo-bloquear o colo da
                 Cloudflare, o status dela passa TAL E QUAL para o browser — nada de fingir. */
              if (url.pathname.startsWith("/px/bnf/")) {
                const sym = url.pathname.slice(8);
                if (!/^[A-Z0-9]{2,20}$/.test(sym)) {
                  return new Response("bad symbol", { status: 400 });
                }
                const up = await fetch("https://fapi.binance.com/fapi/v1/depth?symbol=" + sym + "&limit=1000",
                  { cf: { cacheTtl: 2, cacheEverything: true } });
                return new Response(up.body, { status: up.status, headers: {
                  "content-type": "application/json; charset=utf-8",
                  "cache-control": "public, max-age=2",
                  "access-control-allow-origin": "*",
                  "x-px-upstream": String(up.status)
                } });
              }
              if (!url.pathname.startsWith("/data/")) {
                return fetch(request);
              }
              const key = url.pathname.slice(6);
              if (!/^[A-Za-z0-9._-]{1,100}$/.test(key)) {
                return new Response("bad key", { status: 400 });
              }
              const headers = {
                "content-type": "application/json; charset=utf-8",
                "cache-control": "public, max-age=20",
                "access-control-allow-origin": "*"
              };
              const fromKv = await env.DATA.get(key, "stream");
              if (fromKv !== null) {
                headers["x-data-source"] = "kv";
                return new Response(fromKv, { headers: headers });
              }
              const ghUrl = "https://raw.githubusercontent.com/Bullot-PT/cryptopulse/main/data/" + key;
              const gh = await fetch(ghUrl, { cf: { cacheTtl: 30 } });
              headers["x-data-source"] = "github-fallback";
              return new Response(gh.body, { status: gh.status, headers: headers });
            }
          };
          WEOF
          node --check worker.js || true
          echo "worker written"
      - name: Deploy worker script
        run: |
          cat > metadata.json <<MEOF
          {"main_module":"worker.js","compatibility_date":"2026-07-01","bindings":[{"type":"kv_namespace","name":"DATA","namespace_id":"${CF_KV_NAMESPACE_ID}"}]}
          MEOF
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -F "metadata=@metadata.json;type=application/json" \
            -F "worker.js=@worker.js;type=application/javascript+module" > deploy.json
          cat deploy.json
          jq -e '.success == true' deploy.json > /dev/null
      - name: Ensure routes
        run: |
          curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/workers/routes" > routes.json
          cat routes.json
          for P in "${ROUTE_PATTERN}" "${ROUTE_PATTERN2}"; do
            if jq -e --arg p "$P" '.result[]? | select(.pattern == $p)' routes.json > /dev/null; then
              echo "route $P already exists"
            else
              curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/workers/routes" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
                -d "{\"pattern\":\"$P\",\"script\":\"${SCRIPT_NAME}\"}" > route.json
              cat route.json
              jq -e '.success == true' route.json > /dev/null
            fi
          done
      - name: KV self-test and end-to-end check
        run: |
          echo "{\"selftest\":true,\"runId\":\"${GITHUB_RUN_ID}\"}" > ping.json
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/kv-selftest.json" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" --data-binary @ping.json > kvput.json
          cat kvput.json
          jq -e '.success == true' kvput.json > /dev/null
          sleep 8
          echo "--- via cryptomacho.io ---"
          curl -sS -D - "https://cryptomacho.io/data/kv-selftest.json"
          echo "--- proxy binance perp (o 451/403 aqui e o geo-block da Binance ao colo, nao um erro nosso) ---"
          curl -sS -o px.json -D - "https://cryptomacho.io/px/bnf/BTCUSDT" || true
          head -c 200 px.json; echo
