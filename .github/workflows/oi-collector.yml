name: Collect Hyperliquid OI samples
on:
  schedule:
    # GitHub does NOT honour this list. It is a request, and on the free scheduled-workflow queue most
    # of the six requests an hour are simply dropped: measured on 25-jul-2026 over the previous 57h,
    # 59 samples landed — a median gap of 51 minutes and one gap of 3h23m, against the 10 minutes asked
    # for here. Nothing about that depends on Bullot's PC being on; the runner is GitHub's.
    # The fix is below: one delivered run now stays alive and samples on its own timer for an hour, so a
    # single fire produces ~12 samples instead of 1. Even at one delivered fire per hour the site is
    # covered continuously.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  # 'actions: write' é o que permite ao passo "Queue the next run" despachar a run seguinte.
  # workflow_dispatch é uma das duas excepções à regra do GitHub de que eventos criados com o
  # GITHUB_TOKEN não arrancam workflows — por isso a corrente funciona sem nenhum PAT pessoal.
  actions: write
concurrency:
  # a long-lived run holds the group; the extra fires GitHub does deliver collapse into one pending run
  # that starts the moment this one ends, so coverage is continuous and never doubled up
  group: oi-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # ---- corrente de arranque ----------------------------------------------------------------
      # O cron lá em cima é só um pedido, e o GitHub deita fora quase todos (medido a 25-jul-2026:
      # mediana de 51 min entre fires entregues, pior caso 3h23m). Por isso esta run despacha já a
      # sua sucessora: o grupo de concorrência segura-a em fila enquanto esta corre e ela arranca no
      # instante em que esta acabar — quer acabe normalmente, por timeout, por crash ou cancelada.
      # É isto que transforma o coletor de "esperar que o cron caia" numa corrente contínua.
      - name: Queue the next run (chain)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          WF=oi-collector.yml
          # Disjuntor: se já arrancaram 4 ou mais runs deste workflow nos últimos 15 minutos, alguma
          # coisa está a rebentar logo no arranque e a corrente virou um loop apertado. Nesse caso não
          # despacha nada e deixa o cron voltar a pegar nisto — antes um buraco do que centenas de runs.
          SINCE=$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.run_started_at > \"${SINCE}\")] | length" 2>/dev/null || echo 0)
          echo "runs deste workflow desde ${SINCE}: ${RECENT}"
          if [ "${RECENT:-0}" -ge 4 ]; then
            echo "disjuntor disparado — não despacho sucessora"
            exit 0
          fi
          # O -R é obrigatório: este passo corre ANTES do actions/checkout, portanto o runner ainda não
          # tem nenhum repositório git na pasta de trabalho. Sem -R o gh tenta descobrir o repo pelo
          # remote do git e morre com "fatal: not a git repository" — foi exactamente isso que aconteceu
          # na run #2 do standby às 14:09Z de 25-jul-2026, e a corrente ficou sem despachar ninguém.
          # (O gh api acima já funcionava porque tem o repo escrito no caminho.)
          if gh workflow run "$WF" --ref main -R "${GITHUB_REPOSITORY}"; then
            echo "sucessora em fila — arranca no instante em que esta run terminar"
          else
            echo "não consegui despachar a sucessora — o cron fica como rede"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (sha fixo — a tag pode ser reescrita, o sha não)
      # Pinned, not left to whatever the runner image happens to ship. The collector listens to the
      # Hyperliquid trade feed over a WebSocket to find wallets the leaderboard does not rank, and the
      # global WebSocket is only on by default from Node 22 — on an older runtime that discovery would
      # silently switch itself off and the site would quietly lose coverage of the smaller coins.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (sha fixo — a tag pode ser reescrita, o sha não)
        with:
          node-version: '22'
      - name: Sample every 5 minutes for one hour
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          set -u
          git config user.name "oi-collector-bot"
          git config user.email "actions@users.noreply.github.com"

          push_data() {
            KV_LIST=""
            git add data/
            if git diff --cached --quiet; then
              echo "no change this pass"
              return 0
            fi
            git commit -m "OI sample [skip ci]" >/dev/null || return 0
            # A push gets refused when main moves under us — the Lighter collector pushes to the same
            # branch, and so does any commit made from the browser. The old code handled that with
            # "git pull --rebase origin main". Never again: on 25-jul-2026 one of those rebases stopped
            # mid-way and left a .git/rebase-merge behind on the runner, and from that second onward
            # EVERY pass of that run died with "there is already a rebase-merge directory". The job kept
            # reporting itself as running while the site went 40 minutes without a single new sample.
            #
            # The rebuild below cannot conflict, by construction: jump to the newest main and put back
            # exactly the files this pass wrote, taken from our own commit. Only those files — copying
            # the whole data/ folder would silently revert a file that only the Lighter collector
            # writes back to whatever this runner happened to check out an hour ago.
            MINE=$(git rev-parse HEAD)
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            KV_LIST="$CHANGED"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then return 0; fi
              echo "push refused — rebuilding on top of origin/main (attempt $i)"
              # belt and braces: clear anything half-finished an older version could have left behind
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
              if ! git fetch origin main; then sleep $((i * 5)); continue; fi
              git reset --hard FETCH_HEAD
              for p in $CHANGED; do
                # checkout restores a file we wrote or changed; the rm branch covers one we deleted
                git checkout "$MINE" -- "$p" 2>/dev/null || git rm -q --ignore-unmatch -- "$p"
              done
              git add data/
              if git diff --cached --quiet; then
                echo "someone else already pushed identical data — nothing left to do"
                return 0
              fi
              git commit -m "OI sample [skip ci]" >/dev/null || return 0
              sleep $((i * 3))
            done
            echo "push failed after retries — the next pass will carry these files"
            return 0
          }

          kv_put() {
            # Espelha ficheiros de data/ no Workers KV (o Worker em cryptomacho.io/data/* serve
            # do KV com ~20s de cache no edge, em vez dos 300s+ do raw/Pages). Best-effort:
            # nunca falha o job — sem namespace ou com a API em baixo, o site continua a ler o
            # fallback do GitHub como sempre.
            [ -n "${CF_KV_NAMESPACE_ID:-}" ] || { echo "kv: sem namespace configurado, salto"; return 0; }
            for p in "$@"; do
              case "$p" in data/*) ;; *) continue ;; esac
              [ -f "$p" ] || continue
              k="${p#data/}"
              code=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/${k}" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" --data-binary @"$p" || echo 000)
              echo "kv put ${k}: HTTP ${code}"
            done
            return 0
          }

          END=$(( $(date +%s) + 3300 ))   # keep sampling for 55 minutes, then let the next run take over
          PASS=0
          while : ; do
            PASS=$((PASS + 1))
            echo "--- pass $PASS at $(date -u +%H:%M:%SZ) ---"
            # one bad pass (an exchange API blipping) must not end the hour — alert de-dup state lives in
            # data/alert-state.json and survives across passes, so nothing gets sent twice
            node collect.mjs || echo "collector exited non-zero on this pass — continuing"
            push_data
            # KV a cada passe de 5 min (máxima frescura — regra do Bullot). Conta permitida pelo
            # Workers Paid desde 26-jul; ao planear coletores novos, calcular writes/dia primeiro.
            kv_put $KV_LIST
            NOW=$(date +%s)
            if [ "$NOW" -ge "$END" ]; then break; fi
            # land on the 5-minute grid so samples are evenly spaced no matter how long a pass took
            sleep $(( 300 - (NOW % 300) ))
          done
          echo "finished $PASS passes"
