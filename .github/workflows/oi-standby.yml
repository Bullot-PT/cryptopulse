name: Standby collector (takes over if the main one stops)
on:
  schedule:
    # Offset from the primary's cron so the two are never asking GitHub for a runner at the same minute.
    # GitHub drops most of these fires — that is fine and expected. This workflow exists precisely because
    # fires get dropped: whichever one lands finds out whether the data is still moving.
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  # 'actions: write' é o que permite ao passo "Queue the next run" despachar a run seguinte.
  # workflow_dispatch é uma das duas excepções à regra do GitHub de que eventos criados com o
  # GITHUB_TOKEN não arrancam workflows — por isso a corrente funciona sem nenhum PAT pessoal.
  actions: write
concurrency:
  # A SEPARATE group from 'oi-collect' on purpose. If it shared the primary's group it would queue behind
  # the very run it is supposed to be checking on, and could only ever start once that run had already
  # finished — which is the one moment its check is worthless.
  group: oi-standby
  cancel-in-progress: false
jobs:
  standby:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # ---- corrente de arranque ----------------------------------------------------------------
      # O cron lá em cima é só um pedido, e o GitHub deita fora quase todos (medido a 25-jul-2026:
      # mediana de 51 min entre fires entregues, pior caso 3h23m). Por isso esta run despacha já a
      # sua sucessora: o grupo de concorrência segura-a em fila enquanto esta corre e ela arranca no
      # instante em que esta acabar — quer acabe normalmente, por timeout, por crash ou cancelada.
      # É isto que transforma o coletor de "esperar que o cron caia" numa corrente contínua.
      - name: Queue the next run (chain)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          WF=oi-standby.yml
          # Disjuntor: se já arrancaram 4 ou mais runs deste workflow nos últimos 15 minutos, alguma
          # coisa está a rebentar logo no arranque e a corrente virou um loop apertado. Nesse caso não
          # despacha nada e deixa o cron voltar a pegar nisto — antes um buraco do que centenas de runs.
          SINCE=$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.run_started_at > \"${SINCE}\")] | length" 2>/dev/null || echo 0)
          echo "runs deste workflow desde ${SINCE}: ${RECENT}"
          if [ "${RECENT:-0}" -ge 4 ]; then
            echo "disjuntor disparado — não despacho sucessora"
            exit 0
          fi
          # O -R é obrigatório: este passo corre ANTES do actions/checkout, portanto o runner ainda não
          # tem nenhum repositório git na pasta de trabalho. Sem -R o gh tenta descobrir o repo pelo
          # remote do git e morre com "fatal: not a git repository" — foi exactamente isso que aconteceu
          # na run #2 do standby às 14:09Z de 25-jul-2026, e a corrente ficou sem despachar ninguém.
          # (O gh api acima já funcionava porque tem o repo escrito no caminho.)
          if gh workflow run "$WF" --ref main -R "${GITHUB_REPOSITORY}"; then
            echo "sucessora em fila — arranca no instante em que esta run terminar"
          else
            echo "não consegui despachar a sucessora — o cron fica como rede"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (sha fixo — a tag pode ser reescrita, o sha não)
      # Same pin as the primary — a takeover has to run the collector on the same runtime, or the
      # WebSocket-based wallet discovery would be missing for as long as the standby is in charge.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (sha fixo — a tag pode ser reescrita, o sha não)
        with:
          node-version: '22'
      - name: Take over only if the data has stopped moving
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
        run: |
          set -u

          # Quanto tempo os dados podem ficar parados antes desta run decidir que o principal morreu.
          # O principal amostra numa grelha de 5 minutos, portanto 18 minutos são três passagens
          # falhadas — tempo suficiente para não disparar por causa de uma passagem lenta ou de um
          # retry de push, e curto o suficiente para apanhar uma avaria real dentro de um intervalo
          # de amostragem, em vez dos 51 minutos de mediana que o cron sozinho dá.
          STALE=1080

          git config user.name "oi-standby-bot"
          git config user.email "actions@users.noreply.github.com"

          push_data() {
            git add data/
            if git diff --cached --quiet; then
              echo "no change this pass"
              return 0
            fi
            git commit -m "OI sample (standby) [skip ci]" >/dev/null || return 0
            # A push gets refused when main moves under us — the Lighter collector pushes to the same
            # branch, and so does any commit made from the browser. The old code handled that with
            # "git pull --rebase origin main". Never again: on 25-jul-2026 one of those rebases stopped
            # mid-way and left a .git/rebase-merge behind on the runner, and from that second onward
            # EVERY pass of that run died with "there is already a rebase-merge directory". The job kept
            # reporting itself as running while the site went 40 minutes without a single new sample.
            #
            # The rebuild below cannot conflict, by construction: jump to the newest main and put back
            # exactly the files this pass wrote, taken from our own commit. Only those files — copying
            # the whole data/ folder would silently revert a file that only the Lighter collector
            # writes back to whatever this runner happened to check out an hour ago.
            MINE=$(git rev-parse HEAD)
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then return 0; fi
              echo "push refused — rebuilding on top of origin/main (attempt $i)"
              # belt and braces: clear anything half-finished an older version could have left behind
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
              if ! git fetch origin main; then sleep $((i * 5)); continue; fi
              git reset --hard FETCH_HEAD
              for p in $CHANGED; do
                # checkout restores a file we wrote or changed; the rm branch covers one we deleted
                git checkout "$MINE" -- "$p" 2>/dev/null || git rm -q --ignore-unmatch -- "$p"
              done
              git add data/
              if git diff --cached --quiet; then
                echo "someone else already pushed identical data — nothing left to do"
                return 0
              fi
              git commit -m "OI sample (standby) [skip ci]" >/dev/null || return 0
              sleep $((i * 3))
            done
            echo "push failed after retries — the next pass will carry these files"
            return 0
          }

          # Esta run fica viva uma hora a vigiar, em vez de decidir uma única vez e sair logo. Antes
          # era uma decisão instantânea: olhava para a idade dos dados no segundo em que arrancava e,
          # se o principal estivesse vivo, saía. Como o GitHub entrega quase nenhum fire agendado
          # (a 25-jul-2026 este workflow tinha exactamente 1 fire entregue em toda a sua vida), a rede
          # de segurança era teórica — nunca lá estava no minuto em que era precisa. Agora vigia de 5
          # em 5 minutos durante a hora inteira, e a corrente no passo anterior garante que há sempre
          # uma destas runs viva.
          END=$(( $(date +%s) + 3300 ))
          PASS=0
          while : ; do
            NOW=$(date +%s)
            if [ "$NOW" -ge "$END" ]; then break; fi

            # Olhar para o main verdadeiro, não para o que este runner calhou de fazer checkout há
            # meia hora. Sem isto a idade dos dados congelava no instante do arranque.
            git fetch origin main >/dev/null 2>&1 || true
            git reset --hard FETCH_HEAD >/dev/null 2>&1 || true

            # Duas leituras independentes de "quando é que os dados mexeram pela última vez", porque
            # cada uma sozinha mente: a data do commit falha uma passagem que produziu bytes iguais, e
            # o timestamp dentro do ficheiro falha o caso em que o coletor escreveu mas não conseguiu
            # fazer push.
            COMMIT_T=$(git log -1 --format=%ct -- data/ 2>/dev/null || echo 0)
            DATA_T=$(node -e "
              try {
                const j = JSON.parse(require('fs').readFileSync('data/hl-pos.json','utf8'));
                console.log(Math.round((j.t||0)/1000));
              } catch (e) { console.log(0); }
            " 2>/dev/null || echo 0)
            LAST=$COMMIT_T
            if [ "$DATA_T" -gt "$LAST" ]; then LAST=$DATA_T; fi
            NOW=$(date +%s)
            AGE=$((NOW - LAST))
            WHO=$(git log -1 --format=%an -- data/ 2>/dev/null || echo "")

            # A idade sozinha não chega para decidir. Depois de uma passagem de takeover os dados
            # ficam frescos — escritos por esta run — e olhar só para a idade mandava-me voltar a
            # vigiar com o principal ainda morto, e os dados voltavam a parar 18 minutos. Enquanto o
            # último commit de dados for meu, continuo eu. Quando aparecer um do oi-collector-bot,
            # o principal está de volta e eu saio da frente: dois escritores só se atrapalhavam a
            # disputar o cursor de rotação guardado no hl-pos.json.
            if [ "$AGE" -lt "$STALE" ] && [ "$WHO" != "oi-standby-bot" ]; then
              echo "$(date -u +%H:%M:%SZ) — principal vivo (dados com ${AGE}s, por $WHO), a vigiar"
              sleep $(( 300 - (NOW % 300) ))
              continue
            fi

            PASS=$((PASS + 1))
            echo "--- dados com ${AGE}s (por $WHO) — passagem de takeover $PASS às $(date -u +%H:%M:%SZ) ---"
            node collect.mjs || echo "collector exited non-zero on this pass — continuing"
            push_data

            NOW=$(date +%s)
            sleep $(( 300 - (NOW % 300) ))
          done
          echo "fim: $PASS passagens de takeover nesta run"
