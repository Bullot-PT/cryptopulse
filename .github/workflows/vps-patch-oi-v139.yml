name: VPS patch oi-collector v139
# Corrige a causa de 23 dias sem alertas: cada passagem do collect.mjs era morta pelo
# timeout de 270 s ANTES da cauda (radar-history + alert-log + Telegram), porque a
# Coinalyze bloqueava la no fim e o varrimento de carteiras HL ja gastava ~250-268 s.
#
# 1) oi-daemon.sh: tecto 270 s -> 288 s (a grelha e de 300 s)
# 2) collect.mjs: o await da Coinalyze passa a ter tecto de 12 s (nunca bloqueia a cauda)
# 3) collect.mjs: passe horario e passe de minuto da Coinalyze nunca na mesma passagem
#    (cada um custa 120 creditos = ~155 s de espera pelo limite de 40/min)
# 4) collect.mjs: quando o historico horario esta velho, refaz 7 dias de uma vez
#
# Idempotente: se ja estiver aplicado (marca v139), nao faz nada.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vps-patch-oi
  cancel-in-progress: false

jobs:
  patch:
    runs-on: [self-hosted, vps]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (sha fixo)

      - name: Aplicar patch (rep estrito + node --check)
        run: |
          set -eu
          cat > /tmp/p139.cjs <<'PATCH'
          const fs = require('fs');
          let s = fs.readFileSync('collect.mjs', 'utf8');
          let d = fs.readFileSync('oi-daemon.sh', 'utf8');
          if (s.includes('v139') || d.includes('v139')) { console.log('ja patchado - nada a fazer'); process.exit(3); }
          const rep = (t, a, b) => {
            const n = t.split(a).length - 1;
            if (n !== 1) { console.error('ANCORA FALHOU (' + n + '): ' + a.slice(0, 100)); process.exit(1); }
            return t.replace(a, b);
          };
          s = rep(s,
            "if (czPromise) await czPromise; else console.log('coinalyze skipped (no COINALYZE_KEY secret yet)');",
            "/* v139: esta linha foi a causa de 23 dias sem alertas. A Coinalyze precisa de mais tempo do que a passagem inteira; ficava aqui a bloquear e o timeout do daemon matava o processo ANTES do radar e dos alertas. Agora espera no maximo 12 s. */\nif (czPromise) await Promise.race([czPromise, new Promise(r => setTimeout(r, 12000))]); else console.log('coinalyze skipped (no COINALYZE_KEY secret yet)');");
          s = rep(s,
            "      const hFrom = (out.hT && Object.keys(out.agg).length) ? nowS - 3 * 3600 : nowS - 7 * 86400;",
            "      /* v139: se o balde mais recente ja tem mais de 6 h, refaz os 7 dias de uma vez - o intervalo nao muda o custo em creditos. */\n      const hFrom = (Object.keys(out.agg).reduce((m, k) => Math.max(m, +k), 0) >= nowS - 6 * 3600) ? nowS - 3 * 3600 : nowS - 7 * 86400;");
          s = rep(s,
            "    const minute = await fetchLiq('1min', nowS - 2 * 3600);",
            "    /* v139: passe de minuto NUNCA na mesma passagem que o horario - cada um custa 120 creditos = ~155 s de espera pelo limite de 40/min, e os dois juntos nunca cabiam no tecto da passagem. */\n    const minute = doHourly ? { agg: {}, coins: {} } : await fetchLiq('1min', nowS - 2 * 3600);");
          d = rep(d,
            "  timeout -k 15 270 node collect.mjs",
            "  # v139: tecto subido de 270 s para 288 s. A 270 s a passagem era morta ANTES da cauda\n  # (radar-history + alert-log + Telegram): o varrimento de carteiras HL acaba a ~250-268 s.\n  # A grelha e de 300 s, por isso 288 s ainda deixa a passagem seguinte comecar a horas.\n  timeout -k 10 288 node collect.mjs");
          fs.writeFileSync('collect.mjs', s);
          fs.writeFileSync('oi-daemon.sh', d);
          console.log('patch aplicado');
          PATCH
          set +e
          node /tmp/p139.cjs
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
          [ "$rc" = "0" ] || exit $rc
          node --check collect.mjs
          bash -n oi-daemon.sh
          git --no-pager diff --stat

      - name: Commit para main
        if: env.SKIP != '1'
        run: |
          set -eu
          git config user.name "vps-patch"
          git config user.email "actions@users.noreply.github.com"
          git add collect.mjs oi-daemon.sh
          git commit -m "collect v139: a cauda deixa de morrer no timeout (radar + alertas + coinalyze)"
          git pull --rebase --autostash || true
          git push

      - name: Instalar na VPS, reiniciar e verificar
        if: env.SKIP != '1'
        run: |
          set -eu
          cp collect.mjs oi-daemon.sh /opt/cryptomacho/oi/
          chmod +x /opt/cryptomacho/oi/oi-daemon.sh
          sudo systemctl restart cryptomacho-oi
          sleep 640
          echo "==== log das passagens seguintes ===="
          sudo journalctl -u cryptomacho-oi -n 140 --no-pager
          echo "==== mtimes de data/ ===="
          ls -la --time-style=+%Y-%m-%d_%H:%M /opt/cryptomacho/oi/data
