name: VPS watchdog (frescura do KV)
# Corre nos runners do GITHUB (não na VPS — é ela que está a ser vigiada).
# Se o book-fine.json parar >15 min, alerta no Telegram. O cron do GitHub é uma lotaria
# (pode disparar só de hora a hora) — para um alarme chega; o objectivo é saber ANTES de
# olhares para o site que a VPS calou.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar frescura do book-fine.json e do oi-history.json
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          set -u
          FAIL=0
          alerta() {
            if [ -n "${TELEGRAM_TOKEN:-}" ]; then
              curl -s --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                -d chat_id="${TELEGRAM_CHAT}" --data-urlencode text="$1" >/dev/null || true
            fi
            echo "$1"
            FAIL=1
          }
          # book (serviço cryptomacho-book na VPS, escreve ao minuto)
          T=$(curl -s --max-time 20 "https://cryptomacho.io/data/book-fine.json" | python3 -c "import sys,json;print(json.load(sys.stdin).get('t',0))" 2>/dev/null || echo 0)
          NOW=$(date +%s)000
          AGE_MIN=$(( (NOW - T) / 60000 ))
          echo "book-fine.json: idade ${AGE_MIN} min (t=${T})"
          if [ "${T:-0}" -eq 0 ] || [ "$AGE_MIN" -gt 15 ]; then
            alerta "⚠️ CRYPTOMACHO: book-fine.json parado há ${AGE_MIN} min — a VPS (cryptomacho-book) pode estar em baixo. Fallback: Actions → 'Book depth collector' → Enable workflow. Redeploy: 'VPS deploy book-collector' → Run workflow."
          fi
          # oi (serviço cryptomacho-oi na VPS, amostra de 5 em 5 min)
          TO=$(curl -s --max-time 20 "https://cryptomacho.io/data/oi-history.json" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); s=d.get('samples') or []
          print(s[-1].get('t',0) if s else 0)" 2>/dev/null || echo 0)
          AGE_OI=$(( (NOW - TO) / 60000 ))
          echo "oi-history.json: última amostra há ${AGE_OI} min (t=${TO})"
          if [ "${TO:-0}" -eq 0 ] || [ "$AGE_OI" -gt 20 ]; then
            alerta "⚠️ CRYPTOMACHO: oi-history.json sem amostras há ${AGE_OI} min — a VPS (cryptomacho-oi) pode estar em baixo. Fallback: Actions → 'Collect Hyperliquid OI samples' → Enable workflow. Redeploy: 'VPS deploy oi-collector' → Run workflow."
          fi
          # v135 (18-ago-2026): o vigia estava a olhar so para a CABECA da passagem. O oi-history e
          # escrito na linha 160 do collect.mjs; o alert-log na 1301. Entre 27-jul e 18-ago a passagem
          # foi cortada a meio pelo tecto dos 270 s: o oi-history continuou fresco, este vigia ficou
          # verde, e o liq-totals, o radar-history, o alert-log e o alert-state estiveram tres semanas
          # congelados sem uma unica queixa. Vigiar a CAUDA e o que fecha esse buraco.
          TA=$(curl -s --max-time 20 "https://cryptomacho.io/data/alert-log.json" | python3 -c "import sys,json;print(json.load(sys.stdin).get('t',0))" 2>/dev/null || echo 0)
          AGE_A=$(( (NOW - TA) / 60000 ))
          echo "alert-log.json: idade ${AGE_A} min (t=${TA})"
          if [ "${TA:-0}" -eq 0 ] || [ "$AGE_A" -gt 20 ]; then
            alerta "⚠️ CRYPTOMACHO: alert-log.json parado há ${AGE_A} min — o collect.mjs esta a ser CORTADO antes do fim da passagem (tecto de 270 s no oi-daemon.sh). Ficam por escrever: liq-totals, radar-history, alert-log, alert-state. Ver data/collector-health.json e journalctl -u cryptomacho-oi."
          fi
          TH=$(curl -s --max-time 20 "https://cryptomacho.io/data/collector-health.json" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); print(str(d.get('t',0))+' '+str(d.get('reachedEnd')))" 2>/dev/null || echo "0 None")
          set -- $TH
          AGE_H=$(( (NOW - ${1:-0}) / 60000 ))
          echo "collector-health.json: idade ${AGE_H} min, reachedEnd=${2:-?}"
          if [ "${1:-0}" -eq 0 ] || [ "$AGE_H" -gt 20 ]; then
            alerta "⚠️ CRYPTOMACHO: collector-health.json parado há ${AGE_H} min — o coletor nao esta a reportar saude."
          elif [ "${2:-}" = "False" ]; then
            alerta "⚠️ CRYPTOMACHO: a ultima passagem do collect.mjs NAO chegou ao fim (reachedEnd=false). Ver data/collector-health.json."
          fi
          [ "$FAIL" -eq 0 ] && echo "tudo fresco" || exit 1
